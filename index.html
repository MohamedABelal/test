<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Balance Request</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(14px);
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        color: #fff;
      }

      .badge {
        display: inline-block;
        background: rgba(255, 255, 255, 0.15);
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 12px;
        margin-bottom: 15px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 10px;
      }

      p {
        font-size: 15px;
        line-height: 1.6;
        opacity: 0.85;
        margin-bottom: 30px;
      }

      .input-group {
        margin-bottom: 18px;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: none;
        outline: none;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.9);
      }

      input::placeholder {
        color: #777;
      }

      button {
        width: 100%;
        padding: 15px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 114, 255, 0.5);
      }

      .status {
        text-align: center;
        font-size: 14px;
        margin-top: 15px;
        display: none;
      }

      .success {
        color: #4caf50;
      }

      .error {
        color: #ff5252;
      }

      footer {
        margin-top: 25px;
        font-size: 12px;
        opacity: 0.6;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Balance Submission</span>

      <h1>Submit Your Balance</h1>
      <p>Enter your balance amount below to submit your request.</p>

      <form id="balanceForm">
        <div class="input-group">
          <input
            type="text"
            id="balance"
            placeholder="Balance Amount"
            required
          />
        </div>

        <button type="submit">Submit Request</button>
      </form>

      <div class="status success">✔ Request sent successfully</div>
      <div class="status error">✖ Failed to send request</div>

      <footer>© 2026 Balance System. All rights reserved.</footer>
    </div>

    <script>
      const form = document.getElementById("balanceForm");
      const success = document.querySelector(".success");
      const error = document.querySelector(".error");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        success.style.display = "none";
        error.style.display = "none";

        const payload = {
          balance: document.getElementById("balance").value,
        };

        try {
          const res = await fetch(
            "https://588a605e4404.ngrok-free.app/webhook-test/13668929-8513-48eb-88d4-cfcdc9600f29",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            },
          );

          if (res.ok) {
            success.style.display = "block";
            form.reset();
          } else {
            error.style.display = "block";
          }
        } catch {
          error.style.display = "block";
        }
      });
    </script>
  </body>
</html>
