<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Submission</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #111;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 26px;
    }

    p {
      margin-top: 0;
      margin-bottom: 30px;
      color: #bbb;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      outline: none;
      margin-bottom: 20px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #00d4ff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background: #00a8cc;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connect Your API</h1>
    <p>Enter your API key below. The data will be sent securely to n8n webhook.</p>

    <form id="apiForm">
      <label for="apiKey">API Key</label>
      <input type="text" id="apiKey" name="apiKey" placeholder="sk-xxxxxx" required />
      <button type="submit">Send to n8n</button>
    </form>

    <div class="status" id="status"></div>
  </div>

  <script>
    const form = document.getElementById('apiForm');
    const statusEl = document.getElementById('status');

    // 🔴 Replace with your n8n webhook URL
    const WEBHOOK_URL = 'https://your-n8n-domain/webhook/your-webhook-id';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Sending...';

      const apiKey = document.getElementById('apiKey').value;

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ api_key: apiKey })
        });

        if (!res.ok) throw new Error('Request failed');

        statusEl.textContent = '✅ API key sent successfully.';
        statusEl.style.color = '#4caf50';
        form.reset();
      } catch (err) {
        statusEl.textContent = '❌ Error sending data. Check webhook URL.';
        statusEl.style.color = '#ff5252';
      }
    });
  </script>
</body>
</html>
